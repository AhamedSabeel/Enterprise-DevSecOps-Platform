name: DevSecOps Security Gate

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  secret-scan:
    name: Secret and Credential Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2


  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Dependency Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true


  iac-scan:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: kubernetes
          framework: kubernetes
          quiet: true
          soft_fail: false


  kubernetes-validation:
    name: Kubernetes Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Kubernetes Base Manifests
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            ghcr.io/yannh/kubeconform:latest \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /work/kubernetes/base

      - name: Validate Blue-Green Manifests
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            ghcr.io/yannh/kubeconform:latest \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /work/kubernetes/blue-green

      - name: Validate Enterprise Manifests
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            ghcr.io/yannh/kubeconform:latest \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /work/kubernetes/enterprise


  security-summary:
    name: Security Gate
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - dependency-scan
      - iac-scan
      - kubernetes-validation

    steps:
      - name: Security Gate Passed
        run: |
          echo "=========================================="
          echo "SECURITY GATE PASSED"
          echo "No blocking security violations detected"
          echo "Deployment is allowed to continue"
          echo "=========================================="
