name: DevSecOps Security Gate

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  secret-scan:
    name: Secret and Credential Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2


  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Dependency Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true


  iac-scan:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: kubernetes
          framework: kubernetes
          quiet: true
          soft_fail: false


  kubernetes-validation:
    name: Kubernetes Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Kubernetes Base Manifests
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            ghcr.io/yannh/kubeconform:latest \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /work/kubernetes/base

      - name: Validate Blue-Green Manifests
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            ghcr.io/yannh/kubeconform:latest \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /work/kubernetes/blue-green

      - name: Validate Enterprise Manifests
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            ghcr.io/yannh/kubeconform:latest \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /work/kubernetes/enterprise


security-summary:
  name: Security Gate Decision
  runs-on: ubuntu-latest

  if: always()

  needs:
    - secret-scan
    - dependency-scan
    - iac-scan
    - kubernetes-validation

  steps:

    - name: Evaluate Security Results
      run: |
        echo "=========================================="
        echo "       DEVSECOPS SECURITY GATE"
        echo "=========================================="

        echo ""
        echo "Secret Scan Result: ${{ needs.secret-scan.result }}"
        echo "Dependency Scan Result: ${{ needs.dependency-scan.result }}"
        echo "IaC Scan Result: ${{ needs.iac-scan.result }}"
        echo "Kubernetes Validation Result: ${{ needs.kubernetes-validation.result }}"

        echo ""

        if [[ "${{ needs.secret-scan.result }}" != "success" ]] || \
           [[ "${{ needs.dependency-scan.result }}" != "success" ]] || \
           [[ "${{ needs.iac-scan.result }}" != "success" ]] || \
           [[ "${{ needs.kubernetes-validation.result }}" != "success" ]]; then

          echo "=========================================="
          echo "🚨 SECURITY GATE FAILED"
          echo "=========================================="
          echo ""
          echo "DEPLOYMENT HAS BEEN BLOCKED"
          echo ""
          echo "One or more security checks failed."
          echo ""
          echo "Failed checks must be reviewed and resolved"
          echo "before deployment is allowed."
          echo ""
          echo "Security policy:"
          echo "- HIGH severity vulnerabilities are blocking"
          echo "- CRITICAL severity vulnerabilities are blocking"
          echo "- Infrastructure security violations are blocking"
          echo "- Invalid Kubernetes configurations are blocking"
          echo ""
          echo "=========================================="

          exit 1

        else

          echo "=========================================="
          echo "✅ SECURITY GATE PASSED"
          echo "=========================================="
          echo ""
          echo "No blocking security violations detected."
          echo ""
          echo "DEPLOYMENT IS ALLOWED TO CONTINUE"
          echo ""
          echo "=========================================="

        fi
