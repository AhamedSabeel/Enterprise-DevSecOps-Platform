name: Enterprise DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------
  # 1. SOURCE CODE VALIDATION
  # ---------------------------------------------------------

  source-validation:
    name: Source Code Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Project Structure
        run: |
          echo "Validating Enterprise DevSecOps Platform structure..."

          test -d application
          test -d kubernetes
          test -d infrastructure

          test -f application/backend/Dockerfile
          test -f application/frontend/Dockerfile
          test -f application/auth-service/Dockerfile
          test -f application/worker/Dockerfile

          echo "Source code validation completed successfully."

  # ---------------------------------------------------------
  # 2. BACKEND TESTING
  # ---------------------------------------------------------

backend-tests:
  name: Backend Tests
  runs-on: ubuntu-latest

  needs: source-validation

  services:
    redis:
      image: redis:7-alpine
      ports:
        - 6379:6379
      options: >-
        --health-cmd "redis-cli ping"
        --health-interval 10s
        --health-timeout 5s
        --health-retries 5

  steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set Up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Backend Dependencies
      working-directory: application/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start Backend Application
      working-directory: application/backend
      env:
        DATABASE_URL: sqlite:///./test.db
        REDIS_URL: redis://127.0.0.1:6379/0
      run: |
        uvicorn main:app --host 127.0.0.1 --port 8003 > backend.log 2>&1 &
        echo $! > backend.pid

    - name: Wait for Backend
      working-directory: application/backend
      run: |
        for i in {1..30}; do
          if curl -f http://127.0.0.1:8003/health; then
            echo "Backend is running successfully"
            exit 0
          fi

          echo "Waiting for backend..."
          sleep 2
        done

        echo "Backend failed to start"
        cat backend.log || true
        exit 1

    - name: Run Backend Tests
      working-directory: application/backend
      run: |
        pytest tests/ -v

    - name: Stop Backend Application
      if: always()
      working-directory: application/backend
      run: |
        if [ -f backend.pid ]; then
          kill $(cat backend.pid) || true
        fi


  # ---------------------------------------------------------
  # 3. BUILD APPLICATION IMAGES
  # ---------------------------------------------------------

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t enterprise-devsecops-backend:${{ github.sha }} \
            application/backend

      - name: Build Auth Service Image
        run: |
          docker build \
            -t enterprise-devsecops-auth-service:${{ github.sha }} \
            application/auth-service

      - name: Build Frontend Image
        run: |
          docker build \
            -t enterprise-devsecops-frontend:${{ github.sha }} \
            application/frontend

      - name: Build Worker Image
        run: |
          docker build \
            -t enterprise-devsecops-worker:${{ github.sha }} \
            application/worker

  # ---------------------------------------------------------
  # 4. KUBERNETES SECURITY SCANNING
  # ---------------------------------------------------------

  kubernetes-security:
    name: Kubernetes Security Scan
    runs-on: ubuntu-latest
    needs: source-validation

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Configuration Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: kubernetes/base
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ---------------------------------------------------------
  # 5. TERRAFORM SECURITY SCANNING
  # ---------------------------------------------------------

  terraform-security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    needs: source-validation

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Terraform Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infrastructure/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ---------------------------------------------------------
  # 6. CONTAINER SECURITY SCANNING
  # ---------------------------------------------------------

  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t enterprise-devsecops-backend:${{ github.sha }} \
            application/backend

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-devsecops-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Build Auth Service Image
        run: |
          docker build \
            -t enterprise-devsecops-auth-service:${{ github.sha }} \
            application/auth-service

      - name: Scan Auth Service Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-devsecops-auth-service:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Build Frontend Image
        run: |
          docker build \
            -t enterprise-devsecops-frontend:${{ github.sha }} \
            application/frontend

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-devsecops-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Build Worker Image
        run: |
          docker build \
            -t enterprise-devsecops-worker:${{ github.sha }} \
            application/worker

      - name: Scan Worker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-devsecops-worker:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ---------------------------------------------------------
  # 7. FINAL PIPELINE STATUS
  # ---------------------------------------------------------

  pipeline-success:
    name: Pipeline Completed Successfully
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - build-images
      - kubernetes-security
      - terraform-security
      - container-security

    steps:
      - name: Pipeline Success
        run: |
          echo "=========================================="
          echo "Enterprise DevSecOps CI/CD Pipeline Passed"
          echo "=========================================="
          echo "Source Validation: PASSED"
          echo "Backend Tests: PASSED"
          echo "Docker Builds: PASSED"
          echo "Kubernetes Security: PASSED"
          echo "Terraform Security: PASSED"
          echo "Container Security: PASSED"
