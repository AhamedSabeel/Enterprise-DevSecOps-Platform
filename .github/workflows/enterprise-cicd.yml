name: Enterprise DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------
  # 1. SOURCE CODE VALIDATION
  # ---------------------------------------------------------

  source-validation:
    name: Source Code Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Project Structure
        run: |
          echo "Validating Enterprise DevSecOps Platform structure..."

          test -d application
          test -d kubernetes
          test -d infrastructure

          test -f application/backend/Dockerfile
          test -f application/frontend/Dockerfile
          test -f application/auth-service/Dockerfile
          test -f application/worker/Dockerfile

          echo "Source code validation completed successfully."


  # ---------------------------------------------------------
  # 2. BACKEND TESTING
  # ---------------------------------------------------------

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: source-validation

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        working-directory: application/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Backend Tests
        working-directory: application/backend
        run: |
          pytest tests/ -v


  # ---------------------------------------------------------
  # 3. BUILD APPLICATION IMAGES
  # ---------------------------------------------------------

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t enterprise-devsecops-backend:${{ github.sha }} \
            application/backend

      - name: Build Auth Service Image
        run: |
          docker build \
            -t enterprise-devsecops-auth-service:${{ github.sha }} \
            application/auth-service

      - name: Build Frontend Image
        run: |
          docker build \
            -t enterprise-devsecops-frontend:${{ github.sha }} \
            application/frontend

      - name: Build Worker Image
        run: |
          docker build \
            -t enterprise-devsecops-worker:${{ github.sha }} \
            application/worker


  # ---------------------------------------------------------
  # 4. KUBERNETES SECURITY SCANNING
  # ---------------------------------------------------------

  kubernetes-security:
    name: Kubernetes Security Scan
    runs-on: ubuntu-latest
    needs: source-validation

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Configuration Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: kubernetes/base
          severity: HIGH,CRITICAL
          exit-code: "1"


  # ---------------------------------------------------------
  # 5. TERRAFORM SECURITY SCANNING
  # ---------------------------------------------------------

  terraform-security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    needs: source-validation

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Terraform Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infrastructure/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"


  # ---------------------------------------------------------
  # 6. CONTAINER SECURITY SCANNING
  # ---------------------------------------------------------

  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-devsecops-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan Auth Service Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-devsecops-auth-service:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-devsecops-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan Worker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-devsecops-worker:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"


  # ---------------------------------------------------------
  # 7. FINAL PIPELINE STATUS
  # ---------------------------------------------------------

  pipeline-success:
    name: Pipeline Completed Successfully
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - build-images
      - kubernetes-security
      - terraform-security
      - container-security

    steps:
      - name: Pipeline Success
        run: |
          echo "=========================================="
          echo "Enterprise DevSecOps CI/CD Pipeline Passed"
          echo "=========================================="
          echo "Source Validation: PASSED"
          echo "Backend Tests: PASSED"
          echo "Docker Builds: PASSED"
          echo "Kubernetes Security: PASSED"
          echo "Terraform Security: PASSED"
          echo "Container Security: PASSED"
