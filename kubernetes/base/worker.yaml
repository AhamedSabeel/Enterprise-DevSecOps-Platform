apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: enterprise-devsecops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      labels:
        app: worker

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: worker
          image: enterprise-devsecops-platform-worker:latest
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: enterprise-config
                  key: REDIS_URL
