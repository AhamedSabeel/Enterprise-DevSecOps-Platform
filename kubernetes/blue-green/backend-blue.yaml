apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-blue
  namespace: enterprise-devsecops
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend
      version: blue

  template:
    metadata:
      labels:
        app: backend
        version: blue

    spec:
      containers:
        - name: backend
          image: enterprise-devsecops-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
