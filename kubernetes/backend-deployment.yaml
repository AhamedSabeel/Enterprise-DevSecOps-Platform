apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-backend
  labels:
    app: enterprise-backend
spec:
  replicas: 3

  selector:
    matchLabels:
      app: enterprise-backend

  template:
    metadata:
      labels:
        app: enterprise-backend

    spec:
      containers:
        - name: backend
          image: enterprise-devsecops-platform-backend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL
              value: "postgresql://enterprise_user:enterprise_password@postgres:5432/enterprise_db"

            - name: REDIS_URL
              value: "redis://redis:6379/0"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-backend-service
spec:
  selector:
    app: enterprise-backend

  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

  type: NodePort
