apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: enterprise-devsecops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: enterprise-devsecops-platform-auth-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8001

          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: enterprise-devsecops
spec:
  selector:
    app: auth-service

  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001

  type: ClusterIP
