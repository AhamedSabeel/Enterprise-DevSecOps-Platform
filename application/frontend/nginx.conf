server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /health {
        proxy_pass http://backend-service.enterprise-devsecops.svc.cluster.local:8000/health;
    }

    location /api/ {
        proxy_pass http://backend-service.enterprise-devsecops.svc.cluster.local:8000/api/;
    }
}
